<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DogSay — Session 3: The Crow</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--gold:#FFD93D;--gold2:#E6A032;--text:#F0F4FF;--muted:rgba(240,244,255,0.55);--success:#4ADE80;--danger:#FF4757;--border:rgba(255,217,61,0.2);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0a1204;}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden;}
.lawn-bg{position:absolute;inset:0;background-image:url('https://dogsay.org/images/lawn.png');background-size:cover;background-position:center bottom;animation:breathe 8s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(5,10,5,0.5) 100%);pointer-events:none;}
.top-fade{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(10,22,40,0.65) 0%,transparent 100%);pointer-events:none;}
.bot-fade{position:absolute;bottom:0;left:0;right:0;height:160px;background:linear-gradient(to top,rgba(5,10,5,0.72) 0%,transparent 100%);pointer-events:none;}
.top-bar{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20;}
.logo{font-family:'Righteous',cursive;font-size:20px;color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,0.5);}
.logo em{color:var(--gold);font-style:normal;}
.session-pill{background:rgba(255,217,61,0.12);border:1px solid var(--border);border-radius:50px;padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--gold);text-transform:uppercase;}
.score-badge{position:absolute;top:52px;right:16px;background:rgba(10,22,40,0.85);border:1px solid var(--border);border-radius:12px;padding:8px 12px;text-align:center;z-index:20;}
.score-num{font-family:'Righteous',cursive;font-size:22px;color:var(--gold);line-height:1;}
.score-label{font-size:10px;color:var(--muted);margin-top:2px;}
.enc-dots{position:absolute;top:52px;left:16px;display:flex;gap:5px;z-index:20;}
.enc-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);transition:all 0.3s;}
.enc-dot.used{background:var(--gold2);border-color:var(--gold);}
.scene-crow{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:320px;max-width:60vw;z-index:10;pointer-events:none;transition:width 0.3s ease;}
.scene-crow img{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 30px rgba(0,0,0,0.6));}
@keyframes shake{0%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 10px))}40%{transform:translateX(calc(-50% + 10px))}60%{transform:translateX(calc(-50% - 6px))}80%{transform:translateX(calc(-50% + 6px))}100%{transform:translateX(-50%)}}
@keyframes jump{0%{transform:translateX(-50%) translateY(0) scale(1)}30%{transform:translateX(-50%) translateY(-20px) scale(1.08)}60%{transform:translateX(-50%) translateY(4px) scale(0.97)}100%{transform:translateX(-50%) translateY(0) scale(1)}}
.scene-crow.react-shake{animation:shake 0.3s ease-out forwards;}
.scene-crow.react-jump{animation:jump 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;}
.bark-pulse{position:absolute;inset:0;border:3px solid transparent;pointer-events:none;z-index:15;}
.bark-pulse.flash{animation:bflash 0.35s ease-out forwards;}
@keyframes bflash{0%{border-color:rgba(255,71,87,0.8);box-shadow:inset 0 0 40px rgba(255,71,87,0.1)}100%{border-color:transparent;box-shadow:none}}
.bone-reward{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:180px;z-index:25;opacity:0;pointer-events:none;}
.bone-reward img{width:100%;height:auto;filter:drop-shadow(0 8px 24px rgba(255,217,61,0.5));}
.bone-reward.show{opacity:1;}
@keyframes bone-dance{0%{transform:translate(-50%,-50%) rotate(-15deg) scale(1)}25%{transform:translate(-50%,-65%) rotate(15deg) scale(1.18)}50%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.12)}75%{transform:translate(-50%,-65%) rotate(12deg) scale(1.18)}100%{transform:translate(-50%,-50%) rotate(-15deg) scale(1)}}
.bone-reward.dance{animation:bone-dance 0.55s ease-in-out infinite;}
.instruction{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(10,22,40,0.82);border:1px solid var(--border);border-radius:50px;padding:8px 20px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;backdrop-filter:blur(8px);pointer-events:none;z-index:20;transition:opacity 0.3s;}
.bark-meter{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:min(280px,70vw);display:flex;align-items:center;gap:8px;z-index:20;}
.bark-icon{font-size:16px;flex-shrink:0;}
.bark-track{flex:1;height:5px;background:rgba(255,255,255,0.1);border-radius:50px;overflow:hidden;}
.bark-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--danger),#FF6B6B);width:0%;transition:width 0.06s linear;}
.bark-val{font-size:11px;font-weight:600;color:var(--danger);min-width:22px;text-align:right;}
.victory{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;opacity:0;pointer-events:none;transition:opacity 0.4s;background:rgba(74,222,128,0.06);}
.victory.show{opacity:1;}
.victory-icon{font-size:72px;animation:vpop 0.5s cubic-bezier(0.34,1.56,0.64,1);margin-bottom:12px;}
@keyframes vpop{0%{transform:scale(0)}100%{transform:scale(1)}}
.victory-text{font-family:'Righteous',cursive;font-size:26px;color:var(--success);text-shadow:0 2px 20px rgba(74,222,128,0.5);text-align:center;}
.victory-sub{font-size:14px;color:var(--muted);margin-top:6px;text-align:center;}
.neutral{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;opacity:0;pointer-events:none;transition:opacity 0.4s;}
.neutral.show{opacity:1;}
.neutral-icon{font-size:52px;margin-bottom:10px;}
.neutral-text{font-family:'Righteous',cursive;font-size:20px;color:var(--muted);text-align:center;}
.neutral-sub{font-size:13px;color:rgba(240,244,255,0.35);margin-top:6px;text-align:center;max-width:260px;line-height:1.5;}
.conf{position:fixed;pointer-events:none;font-size:20px;z-index:999;animation:cfall var(--d,1s) ease-out forwards;}
@keyframes cfall{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--tx,0),var(--ty,200px)) rotate(var(--r,360deg)) scale(0.2);opacity:0}}
.tap-overlay{position:absolute;inset:0;background:rgba(10,22,40,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer;}
.tap-icon{font-size:72px;margin-bottom:16px;animation:tpulse 1.5s ease-in-out infinite;}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tap-title{font-family:'Righteous',cursive;font-size:30px;color:#F0F4FF;margin-bottom:8px;}
.tap-sub{font-size:14px;color:rgba(240,244,255,0.5);}
</style>
</head>

  <div class="vignette"></div>
  <div class="top-fade"></div>
  <div class="bot-fade"></div>
  <div class="top-bar"><div class="logo">Dog<em>Say</em></div><div class="session-pill">🐦 The Crow</div></div>
  <div class="score-badge"><div class="score-num" id="score-num">0</div><div class="score-label">score</div></div>

  <div class="victory" id="victory">

    <div class="victory-sub" id="victory-sub">The bone is yours!</div>
  </div>
  <div class="neutral" id="neutral">
    <div class="neutral-icon">🐦</div>
    <div class="neutral-text">The crow took it</div>
    <div class="neutral-sub">Next time — bark louder and faster!</div>
  </div>
  <div class="tap-overlay" id="tap-overlay" onclick="unlockAndStart()">
    <div class="tap-icon">🐦</div>
    <div class="tap-title">Tap to Start</div>
    <div class="tap-sub">Session 3 — The Crow</div>
  </div>
</div>

const FRAME_DATA = {"crow_descending": F_crow_descending,"crow_landing": F_crow_landing,"crow_examining": F_crow_examining,"crow_picking_up": F_crow_picking_up,"crow_startled": F_crow_startled,"crow_flying_bone": F_crow_flying_bone,"crow_dropping": F_crow_dropping,"bone_alone": F_bone_alone,"bone_closeup": F_bone_closeup};

const FRAMES={
  approach: ['crow_descending','crow_landing','crow_examining','crow_picking_up'],
  flyaway:  ['crow_startled','crow_flying_bone','crow_dropping'],
  neutral_leave: ['crow_picking_up','crow_flying_bone'],
};

let CROW_BUFFER = null;

Object.keys(FRAME_DATA).forEach(k=>{const img=new Image();img.src=FRAME_DATA[k];});

async function unlockAndStart(){
  STATE.audioCtx = new(window.AudioContext||window.webkitAudioContext)();
  await STATE.audioCtx.resume();
  try{
    const r = await fetch('sounds/crows_cawing.mp3?v=1');
    const buf = await r.arrayBuffer();
    CROW_BUFFER = await STATE.audioCtx.decodeAudioData(buf);
    console.log('Crow sound loaded, duration:', CROW_BUFFER.duration);
  }catch(e){console.log('Crow load error:',e);}
  document.getElementById('tap-overlay').style.display='none';
  initMic().then(()=>{setTimeout(startSession,600);});
}

let crowSource = null;
function playCrowSound(loop){
  if(!CROW_BUFFER||!STATE.audioCtx)return;
  stopCrowSound();
  try{
    crowSource = STATE.audioCtx.createBufferSource();
    crowSource.buffer = CROW_BUFFER;
    crowSource.loop = loop||false;
    const g = STATE.audioCtx.createGain();
    g.gain.value = 1.0;
    crowSource.connect(g);g.connect(STATE.audioCtx.destination);
    crowSource.start(0);
    console.log('Crow sound playing');
  }catch(e){console.log('Crow play error:',e);}
}

function stopCrowSound(){
  if(crowSource){try{crowSource.stop();}catch(e){}crowSource=null;}
}

function fadeCrowSound(){
  if(!crowSource||!STATE.audioCtx)return;
  try{
    const g = STATE.audioCtx.createGain();
    crowSource.connect(g);g.connect(STATE.audioCtx.destination);
    g.gain.setValueAtTime(1.0, STATE.audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, STATE.audioCtx.currentTime+2.5);
    setTimeout(stopCrowSound, 2500);
  }catch(e){stopCrowSound();}
}

function playJingle(){
  if(!STATE.audioCtx)return;
  try{
    const ctx=STATE.audioCtx,t=ctx.currentTime;
    [[523,0],[659,0.12],[784,0.24],[1047,0.36],[784,0.5],[1047,0.62],[1319,0.74]].forEach(([f,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
      const s=t+d;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.3,s+0.04);g.gain.exponentialRampToValueAtTime(0.001,s+0.25);
      o.start(s);o.stop(s+0.28);
    });
  }catch(e){}
}

function startSession(){
  STATE.phase='approach';STATE.encCount=0;STATE.barkDetected=false;STATE.sessionScore=0;
  document.getElementById('scene-crow').style.opacity='1';
  document.getElementById('bone-reward').classList.remove('show','dance');
  document.getElementById('victory').classList.remove('show');
  document.getElementById('neutral').classList.remove('show');
  for(let i=0;i<3;i++)document.getElementById('enc-'+i).classList.remove('used');
  setInstruction('A crow is after your bone! 🐦');
  showFrame('crow_descending', 0.4);
  // Play sudden crow sound
  setTimeout(()=>playCrowSound(false), 300);
  // Animate crow approaching
  setTimeout(animateCrowApproach, 500);
}

function animateCrowApproach(){
  let fi=0;clearInterval(STATE.frameInterval);
  STATE.frameInterval=setInterval(()=>{
    if(STATE.phase!=='approach'){clearInterval(STATE.frameInterval);return;}
    fi=Math.min(fi+1,FRAMES.approach.length-1);
    const sizeRatio = 0.4 + (fi/(FRAMES.approach.length-1))*0.6;
    showFrame(FRAMES.approach[fi], sizeRatio);
    if(fi>=FRAMES.approach.length-1){
      clearInterval(STATE.frameInterval);
      setTimeout(startWaiting,400);
    }
  },CONFIG.frameCycleMs);
}

function startWaiting(){
  if(STATE.phase!=='approach')return;
  STATE.phase='waiting';
  setInstruction('Chase it away! Bark! 🐦');
  playEncouragement();
}

function playEncouragement(){
  if(STATE.phase!=='waiting')return;
  if(STATE.encCount>=CONFIG.maxEncouragements){setTimeout(neutralEnding,1000);return;}
  if(STATE.encCount<3)document.getElementById('enc-'+STATE.encCount).classList.add('used');
  STATE.encCount++;
  setInstruction('Bark it away! ('+STATE.encCount+'/'+CONFIG.maxEncouragements+')');
  playClip(2);
  STATE.encTimer=setTimeout(()=>{
    if(!STATE.barkDetected&&STATE.phase==='waiting')playEncouragement();
  },CONFIG.encouragementInterval*1000);
}

function onBarkResponse(){
  if(STATE.phase!=='waiting')return;
  STATE.phase='result-good';STATE.barkDetected=true;clearTimeout(STATE.encTimer);
  const speedScore=STATE.encCount===1?100:STATE.encCount===2?65:35;
  const volScore=Math.min(100,STATE.intensity*1.2);
  STATE.sessionScore=Math.round((speedScore*0.6)+(volScore*0.4));
  document.getElementById('score-num').textContent=STATE.sessionScore;
  setInstruction('');
  // Crow startled — shakes then flies away
  const crow = document.getElementById('scene-crow');
  crow.classList.add('react-shake');
  setTimeout(()=>{crow.classList.remove('react-shake');},350);
  // Stop crow sound, play fading version
  stopCrowSound();
  setTimeout(()=>playCrowSound(false),100);
  setTimeout(fadeCrowSound,800);
  // Animate crow flying away
  clearInterval(STATE.frameInterval);
  let fi=0;
  STATE.frameInterval=setInterval(()=>{
    const sizeRatio = 1.0 - (fi/(FRAMES.flyaway.length-1))*0.7;
    showFrame(FRAMES.flyaway[Math.min(fi,FRAMES.flyaway.length-1)], sizeRatio);
    fi++;
    if(fi>=FRAMES.flyaway.length){
      clearInterval(STATE.frameInterval);
      document.getElementById('scene-crow').style.opacity='0';
      setTimeout(showBoneReward,400);
    }
  },500);
}

function showBoneReward(){
  STATE.phase='done-good';
  const bone=document.getElementById('bone-reward');
  bone.classList.add('show','dance');
  playJingle();
  setTimeout(()=>playClip(3),300);
  setTimeout(()=>{
    document.getElementById('victory-sub').textContent='Score: '+STATE.sessionScore+' — The bone is yours!';
    document.getElementById('victory').classList.add('show');
    spawnConfetti();
  },500);
  setTimeout(()=>{
    document.getElementById('victory').classList.remove('show');
    bone.classList.remove('show','dance');
    proceedToEnd();
  },4000);
}

function neutralEnding(){
  STATE.phase='result-neutral';setInstruction('');
  // Crow flies away WITH bone
  clearInterval(STATE.frameInterval);
  playCrowSound(false);
  let fi=0;
  STATE.frameInterval=setInterval(()=>{
    const sizeRatio = 1.0-(fi/(FRAMES.neutral_leave.length-1))*0.8;
    showFrame(FRAMES.neutral_leave[Math.min(fi,FRAMES.neutral_leave.length-1)], sizeRatio);
    fi++;
    if(fi>=FRAMES.neutral_leave.length){
      clearInterval(STATE.frameInterval);
      fadeCrowSound();
      document.getElementById('scene-crow').style.opacity='0';
      setTimeout(()=>{
        STATE.phase='done-neutral';STATE.sessionScore=10;
        document.getElementById('score-num').textContent=STATE.sessionScore;
        document.getElementById('neutral').classList.add('show');
        setTimeout(()=>{
          document.getElementById('neutral').classList.remove('show');
          proceedToEnd();
        },3000);
      },400);
    }
  },700);
}

function proceedToEnd(){
  alert('Session 3 complete! Score: '+STATE.sessionScore+'\n\nAll 3 sessions done!\n→ End screen would appear here.');
  document.getElementById('scene-crow').style.opacity='1';
  STATE.phase='init';
  setTimeout(startSession,800);
}

function showFrame(key,sizeRatio){
  document.getElementById('crow-frame').src=FRAME_DATA[key];
  const minW=120,maxW=Math.min(window.innerWidth*0.65,380);
  document.getElementById('scene-crow').style.width=(minW+(maxW-minW)*Math.min(1,Math.max(0,sizeRatio)))+'px';
}

function triggerBarkReaction(){
  const crow=document.getElementById('scene-crow');
  crow.classList.remove('react-shake','react-jump');void crow.offsetWidth;
  crow.classList.add(Math.random()>0.5?'react-shake':'react-jump');
  setTimeout(()=>crow.classList.remove('react-shake','react-jump'),400);
  const pulse=document.getElementById('bark-pulse');pulse.classList.remove('flash');void pulse.offsetWidth;pulse.classList.add('flash');
}

async function initMic(){
  try{
    STATE.micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    STATE.analyser=STATE.audioCtx.createAnalyser();STATE.analyser.fftSize=512;STATE.analyser.smoothingTimeConstant=0.2;
    STATE.audioCtx.createMediaStreamSource(STATE.micStream).connect(STATE.analyser);
    setTimeout(calibrateNoise,1500);startBarkLoop();
  }catch(e){setInstruction('Mic unavailable');}
}

function calibrateNoise(){if(!STATE.analyser)return;const b=new Uint8Array(STATE.analyser.frequencyBinCount);STATE.analyser.getByteFrequencyData(b);let s=0;for(let i=0;i<b.length;i++)s+=b[i];STATE.noiseFloor=(s/b.length)+8;}

function startBarkLoop(){
  const buf=new Uint8Array(STATE.analyser.frequencyBinCount);
  function tick(){
    requestAnimationFrame(tick);STATE.analyser.getByteFrequencyData(buf);
    const sr=STATE.audioCtx.sampleRate,bs=sr/STATE.analyser.fftSize;
    const lo=Math.floor(CONFIG.barkFrequencyLow/bs),hi=Math.floor(CONFIG.barkFrequencyHigh/bs);
    let e=0;for(let i=lo;i<Math.min(hi,buf.length);i++)e+=buf[i];e/=(hi-lo);
    STATE.intensity=Math.min(100,Math.max(0,(e-STATE.noiseFloor)*2.5));
    document.getElementById('bark-fill').style.width=STATE.intensity+'%';
    document.getElementById('bark-val').textContent=Math.round(STATE.intensity);
    document.getElementById('bark-icon').textContent=STATE.intensity>70?'🔊':STATE.intensity>35?'🔉':'🔇';
    const now=Date.now(),isBark=STATE.intensity>=CONFIG.barkThresholdMin;
    if(isBark&&!STATE.barkActive){STATE.barkActive=true;STATE.barkStart=now;}
    else if(!isBark&&STATE.barkActive){
      STATE.barkActive=false;const dur=now-STATE.barkStart;
      if(dur>=CONFIG.barkDurationMin&&now-STATE.lastBarkTime>500){
        STATE.lastBarkTime=now;triggerBarkReaction();
        if(STATE.phase==='waiting'&&!STATE.barkDetected)onBarkResponse();
      }
    }
  }
  tick();
}

function playClip(idx){if(!STATE.clips[idx])return;try{const url=URL.createObjectURL(STATE.clips[idx]);const a=new Audio(url);a.volume=1.0;a.play().catch(()=>{});a.onended=()=>URL.revokeObjectURL(url);}catch(e){}}
function setInstruction(txt){const el=document.getElementById('instruction');el.textContent=txt;el.style.opacity=txt?'1':'0';}
function spawnConfetti(){['🎉','🦴','⭐','✨','🎊','💚'].forEach((em,i)=>{const e=document.createElement('div');e.className='conf';e.textContent=em;e.style.cssText='left:'+(20+Math.random()*60)+'%;top:30%;--tx:'+(Math.random()-0.5)*300+'px;--ty:'+(-180-Math.random()*180)+'px;--r:'+(Math.random()-0.5)*720+'deg;--d:'+(0.7+Math.random()*0.6)+'s;animation-delay:'+(i*0.04)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1500);});}
</script>
</body>
