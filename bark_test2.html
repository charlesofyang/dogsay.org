<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Bark Test</title></head>
<body style="background:#0A1628;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;gap:20px">
<h2>DogSay Bark Test</h2>
<button onclick="test1()" style="padding:15px 30px;font-size:16px;border-radius:50px;border:none;background:#FFD93D;color:#0A1628;font-weight:700;cursor:pointer">Test 1 — Audio tag</button>
<button onclick="test2()" style="padding:15px 30px;font-size:16px;border-radius:50px;border:none;background:#FFD93D;color:#0A1628;font-weight:700;cursor:pointer">Test 2 — Fetch + AudioContext</button>
<button onclick="test3()" style="padding:15px 30px;font-size:16px;border-radius:50px;border:none;background:#4ADE80;color:#0A1628;font-weight:700;cursor:pointer">Test 3 — Direct link play</button>
<div id="status" style="font-size:14px;color:rgba(255,255,255,0.6);text-align:center;max-width:400px"></div>
<audio id="aud" controls src="sounds/dog_bark.mp3" style="margin-top:20px"></audio>

<script>
const log = msg => { document.getElementById('status').textContent = msg; console.log(msg); };

function test1() {
  log('Test 1: Playing via Audio element...');
  const a = new Audio('sounds/dog_bark.mp3?v=' + Date.now());
  a.volume = 1.0;
  a.play().then(() => log('✅ Test 1: Playing! Duration: ' + a.duration)).catch(e => log('❌ Test 1 failed: ' + e));
}

function test2() {
  log('Test 2: Fetching and decoding via AudioContext...');
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  fetch('sounds/dog_bark.mp3?v=' + Date.now())
    .then(r => r.arrayBuffer())
    .then(buf => ctx.decodeAudioData(buf))
    .then(decoded => {
      const src = ctx.createBufferSource();
      src.buffer = decoded;
      src.connect(ctx.destination);
      src.start(0);
      log('✅ Test 2: Playing via AudioContext! Duration: ' + decoded.duration);
    })
    .catch(e => log('❌ Test 2 failed: ' + e));
}

function test3() {
  log('Test 3: Using built-in audio player above — press play on the audio bar');
  document.getElementById('aud').play().then(() => log('✅ Test 3: Playing!')).catch(e => log('❌ Test 3: ' + e));
}
</script>
</body>
</html>
